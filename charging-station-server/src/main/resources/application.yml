server:
  port: 8080
  servlet:
    context-path: /api
spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/charging_station?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 管理端接口
      paths-to-match: /admin/**
      packages-to-scan: com.charging.controller.admin
    - group: 小程序端接口
      paths-to-match: /miniapp/**
      packages-to-scan: com.charging.controller.miniapp
knife4j:
  enable: true
  setting:
    language: zh_cn
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-here-must-be-at-least-256-bits-long-enough-for-hmac}
  expiration: 86400000
ai:
  provider: deepseek
  api-key: ${AI_API_KEY:your-api-key}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat
  system-prompt: 你是一个专业的新能源充电站客服助手，可以帮助用户解答关于充电站位置、充电价格、充电流程、账户问题等方面的问题。请用友好的语气回答用户的问题。
