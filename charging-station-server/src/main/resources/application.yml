server:
  port: 8080
  servlet:
    context-path: /api
spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/charging_station?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
  rabbitmq:
    # 延迟队列依赖：充电超时自动结算、待支付订单自动关单
    host: ${MQ_HOST:localhost}
    port: ${MQ_PORT:5672}
    username: ${MQ_USERNAME:guest}
    password: ${MQ_PASSWORD:guest}
    virtual-host: ${MQ_VHOST:/}
    connection-timeout: 3s
    # 生产者确认：消息未到达交换机/队列时回调 nack，据此重试或转兜底任务
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # 手动 ACK：业务真正处理成功再确认，防止进程崩溃导致消息丢失
        acknowledge-mode: manual
        prefetch: 10
        # 重试/拒绝的消息不再回灌原队列，交由业务侧重试计数或兜底任务处理
        default-requeue-rejected: false
        # 无 RabbitMQ 环境（如本地只起 MySQL/Redis）时可关闭，避免启动噪音
        auto-startup: ${MQ_LISTENER_ENABLED:true}
        retry:
          enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 管理端接口
      paths-to-match: /admin/**
      packages-to-scan: com.charging.controller.admin
    - group: 小程序端接口
      paths-to-match: /miniapp/**
      packages-to-scan: com.charging.controller.miniapp
knife4j:
  enable: true
  setting:
    language: zh_cn
cors:
  # 跨域白名单来源(逗号分隔，支持通配符，如 https://*.example.com)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
ai:
  provider: deepseek
  api-key: ${AI_API_KEY:your-api-key}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat
  # 每用户每日 AI 对话次数上限
  daily-limit: 50
  system-prompt: 你是一个专业的新能源充电站客服助手，可以帮助用户解答关于充电站位置、充电价格、充电流程、账户问题等方面的问题。请用友好的语气回答用户的问题。
pay:
  # 模拟支付开关：true 时充值接口直接入账(仅限本地/演示环境)。
  # 生产环境必须置为 false 并接入真实支付网关(微信支付 V3 下单+回调验签)。
  mock-enabled: ${PAY_MOCK_ENABLED:true}
  # 允许的充值档位(元)，服务端以此裁决金额合法性，不接受客户端任意数值
  amount-options: 10,50,100,200,500
  # 单用户单日累计充值上限(元)
  daily-limit: 2000
order:
  # 单次充电最长时长(分钟)。超过该时长用户仍未结束充电，由延迟消息触发自动结算，
  # 解决"拔枪不点结束"导致的订单永久充电中、枪永久占用（卡单）。
  max-charging-minutes: ${MAX_CHARGING_MINUTES:720}
  # 待支付订单保留时长(分钟)。超期自动关单，避免占着状态不动、对账口径混乱。
  unpaid-timeout-minutes: ${UNPAID_TIMEOUT_MINUTES:15}
  # 兜底补偿任务：MQ 宕机/消息丢失/进程重启时的最后一道防线，扫描数据库而非依赖消息
  compensation:
    enabled: ${COMPENSATION_ENABLED:true}
    # 扫描间隔(毫秒)
    fixed-delay-ms: ${COMPENSATION_FIXED_DELAY_MS:60000}
    # 单次扫描处理条数上限，防止一次拉太多拖垮数据库
    batch-size: ${COMPENSATION_BATCH_SIZE:200}
