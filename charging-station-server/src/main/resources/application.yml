server:
  port: 8080
  servlet:
    context-path: /api
spring:
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/charging_station?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 管理端接口
      paths-to-match: /admin/**
      packages-to-scan: com.charging.controller.admin
    - group: 小程序端接口
      paths-to-match: /miniapp/**
      packages-to-scan: com.charging.controller.miniapp
knife4j:
  enable: true
  setting:
    language: zh_cn
cors:
  # 跨域白名单来源(逗号分隔，支持通配符，如 https://*.example.com)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
ai:
  provider: deepseek
  api-key: ${AI_API_KEY:your-api-key}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat
  # 每用户每日 AI 对话次数上限
  daily-limit: 50
  system-prompt: 你是一个专业的新能源充电站客服助手，可以帮助用户解答关于充电站位置、充电价格、充电流程、账户问题等方面的问题。请用友好的语气回答用户的问题。
pay:
  # 模拟支付开关：true 时充值接口直接入账(仅限本地/演示环境)。
  # 生产环境必须置为 false 并接入真实支付网关(微信支付 V3 下单+回调验签)。
  mock-enabled: ${PAY_MOCK_ENABLED:true}
  # 允许的充值档位(元)，服务端以此裁决金额合法性，不接受客户端任意数值
  amount-options: 10,50,100,200,500
  # 单用户单日累计充值上限(元)
  daily-limit: 2000
